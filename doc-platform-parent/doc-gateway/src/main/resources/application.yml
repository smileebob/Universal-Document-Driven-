# ============================================================
# 占位默认值仅供本地开发，生产一律经环境变量注入。
# 生产环境禁止使用本文件中的任何默认敏感配置（R-05：敏感值环境变量注入，Nacos 零明文）。
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  # 优雅停机
  shutdown: graceful

spring:
  application:
    name: doc-gateway
  config:
    # Nacos 配置导入（SCA 2025.0.0.0 已移除 bootstrap 支持，不建 bootstrap.yml）；
    # optional 前缀：Nacos 不可达时不阻断启动（生产可去掉 optional 改为强依赖）。
    # 路由表沉淀于 Nacos doc-gateway.yaml 支持动态刷新（GW-02 验证点）
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
      config:
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      enabled: true
      transport:
        # Sentinel 控制台地址占位（未部署控制台时不影响限流规则本地生效）
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      # Sentinel 网关规则持久化模板（规范要求：Nacos 为唯一规则源，控制台仅监控）。
      # 接入时取消注释，并在 pom 中启用 sentinel-datasource-nacos 依赖（见注释）；
      # dataId 约定：${spring.application.name}-gw-flow-rules。
      #datasource:
      #  gw-flow-rules:
      #    nacos:
      #      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      #      namespace: ${NACOS_NAMESPACE:}
      #      data-id: ${spring.application.name}-gw-flow-rules
      #      group-id: SENTINEL_GROUP
      #      data-type: json
      #      rule-type: gw-flow
    gateway:
      # Cloud 2025.0.x 起响应式网关配置迁移至 server.webflux 命名空间（design/09 §2.2）
      server:
        webflux:
          # CORS 只在网关单点配置（I-07/GW-06）：必须使用 Gateway 绑定的 globalcors 键，
          # 而非 Spring MVC 的 spring.web.cors（后者在本网关不生效）。
          # 生产经 CORS_ALLOWED_ORIGIN_PATTERNS 注入具体域名白名单，禁止 "*" + credentials 组合。
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
                allowed-methods: GET,POST,PUT,DELETE,OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          # 路由表（GW-02：语义化路由 id；uri 一律 lb:// 经 Nacos 服务发现 + 负载均衡，GW-03）；
          # 网关不做 StripPrefix（服务内 Controller 映射路径本身含 /api/v1 前缀）；
          # /api/v1/internal/** 不配置任何路由（A-07），外部请求该前缀一律 404，仅内网 Feign 直达
          routes:
            - id: meta-route
              uri: lb://meta-service
              predicates:
                - Path=/api/v1/schema/**,/api/v1/rule/**,/api/v1/menu/**,/api/v1/admin/index-tasks/**
            - id: runtime-route
              uri: lb://runtime-service
              predicates:
                - Path=/api/v1/data/**,/api/v1/query/**,/api/v1/audit/**,/api/v1/saga/**,/api/v1/event/**,/api/v1/admin/reconcile/**,/api/v1/admin/doc-operations/**
  lifecycle:
    # 优雅停机等待时长，须小于部署脚本强杀超时（deploy/app.sh WAIT_TIMEOUT）
    timeout-per-shutdown-phase: 30s

# 网关认证配置（AuthGlobalFilter 绑定；放行规则从简、留扩展点）
doc:
  gateway:
    auth:
      enabled: ${GATEWAY_AUTH_ENABLED:true}
      # JWT 签名密钥（HS256，生产经环境变量注入，R-05 零明文；prod 要求 ≥32 字节）
      secret: ${GATEWAY_JWT_SECRET:}
      # 放行路径前缀（Ant 风格；健康检查固定放行，扩展点按需追加）
      skip-paths: /actuator/**
      # 可选归属校验：配置后强制校验（生产建议配置，与签发方一致）
      issuer: ${GATEWAY_JWT_ISSUER:}
      audience: ${GATEWAY_JWT_AUDIENCE:}
      # 可信反向代理/负载均衡地址（精确 IP；仅这些来源允许携带 X-Forwarded-For 链）
      trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
      # 仅 dev demo：认证关闭时保留前端演示身份头（prod 强制 false）
      allow-demo-identity-headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
---
# ============================================================
# dev profile：本地 demo（无企业身份提供方）。
# 认证关闭 + 显式允许前端演示身份头，仅用于本机三角色演示；
# 生产（prod）由 GatewayAuthStartupGuard 强制开启认证并禁止演示身份头。
# ============================================================
spring:
  config:
    activate:
      on-profile: dev

doc:
  gateway:
    auth:
      enabled: ${GATEWAY_AUTH_ENABLED:false}
      allow-demo-identity-headers: true
---
# ============================================================
# prod profile：Sentinel 网关流控规则持久化到 Nacos（唯一规则源）。
# 控制台仅监控；规则 data-id 由运维在 SENTINEL_GROUP 中维护。
# ============================================================
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    sentinel:
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR}
            namespace: ${NACOS_NAMESPACE}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-gw-flow-rules
            data-type: json
            rule-type: gw-flow
