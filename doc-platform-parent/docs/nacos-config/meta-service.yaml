# ============================================================
# meta-service 私有配置（Nacos dataId: meta-service.yaml，Group: DEFAULT_GROUP，R-02）。
# 优先级高于 common.yml（R-04 分层）；敏感值一律 ${ENV} 占位（R-05 零明文）。
# ============================================================

rocketmq:
  producer:
    # 覆盖 common.yml 公共 group：schema 发布缓存失效广播生产者
    group: ${spring.application.name}-pg

doc:
  cache:
    # schema 缓存参数（design/06：广播失效 + TTL 兜底，广播丢失容忍 ≤ 5s）
    schema:
      ttl-seconds: ${SCHEMA_CACHE_TTL_SECONDS:300}
      null-value-ttl-seconds: ${SCHEMA_CACHE_NULL_TTL_SECONDS:30}
  broadcast:
    # 缓存失效广播 Topic（发布/停用事件，Tag 区分类型，design/07）
    topic: ${MQ_TOPIC_CACHE_INVALIDATE:doc-cache-invalidate}
